services:
  postgres:
    image: postgres:15.10-alpine
    container_name: worklenz-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: worklenz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: worklenz_test_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF8 --lc-ctype=en_US.UTF8"
    volumes:
      - ./worklenz-backend/database:/database:ro
    ports:
      - "54328:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worklenz_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: worklenz-test-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass worklenz_test_redis
    ports:
      - "63798:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a worklenz_test_redis ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: worklenz-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9008:9000"
      - "9009:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
